<title>Joey's Multipurpose App</title>
<style>
/* Layout: one-screen pocket app. Purple clock panel with watch-bezel ticks on top, then a big two-column feature menu, then optional widgets; floating dock tab bar at the bottom. White ground, purple as the sub color. */
:root{
  --bg:#FFFFFF;
  --surface:#FFFFFF;
  --surface-2:#F5F2FC;
  --ink:#1A1428;
  --ink-2:#605873;
  --line:#E4DEF0;
  --danger:#C0342A;
  --ok:#178F5E;
  --accent:#6A3FD8;
  --on-accent:#FFFFFF;
  --accent-ink:color-mix(in srgb,var(--accent) 86%,#000);
  --accent-soft:color-mix(in srgb,var(--accent) 10%,#fff);
  --scrim:rgba(20,14,36,.42);
  --shadow:0 1px 2px rgba(40,24,90,.05),0 8px 22px rgba(40,24,90,.07);
  --font-ui:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"DM Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:20px;
  --r-sm:12px;
  --wx-cloud:#B4BCCB;
  --night-bg:#040306;
  --night-fg:#9A88D6;
  --night-dim:#544A70;
}
/* optional light-theme background tints (the dark blocks below win in dark mode) */
:root.bg-lavender{--bg:#F6F2FD}
:root.bg-mist{--bg:#F1F2F5}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#110E19;--wx-cloud:#7F889A;--surface:#1A1624;--surface-2:#231E30;--ink:#EEEAF7;--ink-2:#A39CB6;--line:#2F2840;--danger:#FF6B5E;--ok:#3FCB91;--accent-ink:color-mix(in srgb,var(--accent) 55%,#fff);--accent-soft:color-mix(in srgb,var(--accent) 24%,#1A1624);--scrim:rgba(0,0,0,.6);--shadow:0 1px 2px rgba(0,0,0,.5);color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#110E19;--wx-cloud:#7F889A;--surface:#1A1624;--surface-2:#231E30;--ink:#EEEAF7;--ink-2:#A39CB6;--line:#2F2840;--danger:#FF6B5E;--ok:#3FCB91;--accent-ink:color-mix(in srgb,var(--accent) 55%,#fff);--accent-soft:color-mix(in srgb,var(--accent) 24%,#1A1624);--scrim:rgba(0,0,0,.6);--shadow:0 1px 2px rgba(0,0,0,.5);color-scheme:dark}

html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:.9375rem;line-height:1.45;padding-inline:16px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{opacity:.35;cursor:default}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
.ic{width:22px;height:22px;flex:none}
.muted{color:var(--ink-2)}
.grow{flex:1}
.late{color:var(--danger)!important;font-weight:650}
.calm *{animation:none!important;transition:none!important}
[hidden]{display:none!important}

.app{position:relative;height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
#main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(100px + env(safe-area-inset-bottom,0px));scrollbar-width:none}
.app:has(.dock[hidden]) #main{padding-bottom:20px}
#main::-webkit-scrollbar{display:none}

/* header */
.hd{position:relative;z-index:5;background:none;padding-block:14px 12px;display:flex;align-items:center;gap:8px}
.hd .ib{background:color-mix(in srgb,var(--surface) 84%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-color:color-mix(in srgb,var(--line) 75%,transparent)}
.hd.stack{flex-direction:column;align-items:stretch;gap:10px}
.hd-row{display:flex;align-items:center;gap:8px}
.hd-main{flex:1;min-width:0}
.hd h1{margin:0;font-stretch:125%;font-weight:800;font-size:1.625rem;line-height:1.08;letter-spacing:-.015em;text-wrap:balance}
.eyebrow{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-bottom:3px;display:flex;gap:10px;align-items:center}
.ib{width:40px;height:40px;flex:none;border-radius:var(--r-sm);display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.ib.accent{background:var(--accent);color:var(--on-accent);border-color:transparent}
.ib.ghost{background:none;border-color:transparent}
.ib.sm{width:34px;height:34px}
.ib.sm .ic{width:18px;height:18px}

/* dock */
.dock{position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:6px;padding:0;margin:0;background:none;border:0;pointer-events:none}
.dock button{pointer-events:auto;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;border-radius:17px;font-size:.6875rem;font-weight:650;color:var(--ink-2);text-align:center;background:color-mix(in srgb,var(--surface) 84%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid color-mix(in srgb,var(--line) 75%,transparent);box-shadow:0 3px 12px rgba(30,15,70,.12)}
.dock button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock button[aria-current="page"]{background:var(--accent);color:var(--on-accent);border-color:transparent}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:var(--r-sm);font-weight:650;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap;color:var(--ink)}
.btn.sm{padding:8px 12px;font-size:.845rem}
.btn .ic{width:18px;height:18px}
.btn.accent{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:var(--surface);border-color:transparent}
.link{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.link.armed{color:var(--danger)}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.8125rem;font-weight:650;white-space:nowrap;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.seg{display:flex;gap:3px;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm)}
.seg button{flex:1;padding:7px 8px;border-radius:calc(var(--r-sm) - 3px);font-size:.845rem;font-weight:650;color:var(--ink-2);text-align:center;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent-ink);box-shadow:var(--shadow)}
.seg.sm button{padding:5px 8px;font-size:.78rem}
.in{width:100%;font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;min-width:0}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
textarea.in{resize:vertical;line-height:1.5}
.range{width:100%;accent-color:var(--accent)}
.toggle{width:48px;height:28px;flex:none;border-radius:14px;background:var(--line);position:relative;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.toggle[aria-pressed="true"]{background:var(--accent)}
.toggle[aria-pressed="true"]::after{transform:translateX(20px);background:#fff}
.chk{width:24px;height:24px;flex:none;border-radius:50%;border:2px solid var(--ink-2);display:grid;place-items:center;margin-top:1px}
.chk .ic{width:15px;height:15px;stroke-width:3}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* hero clock */
.hero{position:relative;border-radius:var(--r);padding:28px 18px 16px;background:var(--accent);color:var(--on-accent);overflow:hidden;margin-bottom:18px}
.hero::before{content:"";position:absolute;left:12px;right:12px;top:0;height:14px;pointer-events:none;
  background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--on-accent) 55%,transparent) 0 2px,transparent 2px 60px) 0 0/100% 13px no-repeat,
             repeating-linear-gradient(90deg,color-mix(in srgb,var(--on-accent) 30%,transparent) 0 1.5px,transparent 1.5px 12px) 0 0/100% 7px no-repeat}
.hero-top{display:flex;justify-content:space-between;gap:10px;font-family:var(--font-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;opacity:.85;margin-bottom:6px}
.hero-top{flex-wrap:wrap;row-gap:2px}
.hero-top span{white-space:nowrap}
.w-hit{position:absolute;inset:0;border-radius:var(--r);z-index:1}
.big-time{display:flex;align-items:baseline;flex-wrap:wrap;font-stretch:125%;font-weight:800;font-size:clamp(3rem,calc(10vw + 1.6rem),5.4rem);line-height:.95;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.big-time .sec{font-size:.4em;font-weight:700;opacity:.6;margin-left:.06em;letter-spacing:0}
.big-time .ap{font-size:.28em;font-weight:700;margin-left:.4em;letter-spacing:.04em;font-stretch:100%}
.hero-date{margin-top:8px;font-weight:650;font-size:1.0625rem}
.hero-wx{margin-top:12px;display:grid;gap:8px}
.hw-main{display:flex;align-items:center;gap:8px}
.hw-main .wx-ic{width:38px;height:38px}
.hw-main b{font-stretch:118%;font-weight:800;font-size:1.75rem;line-height:1;font-variant-numeric:tabular-nums}
.hw-main span{display:flex;flex-direction:column;font-weight:650;line-height:1.2}
.hw-main small{font-size:.78rem;font-weight:500;opacity:.85}
.hw-rain{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--r-sm);background:color-mix(in srgb,var(--on-accent) 14%,transparent);font-weight:650}
.hw-rain span{flex:1;min-width:0}
.hw-rain b{font-weight:800;font-variant-numeric:tabular-nums}
.hw-drop{width:16px;height:16px;flex:none}
.hw-flags{display:flex;flex-wrap:wrap;gap:6px}
.hw-flag{font-size:.78rem;font-weight:750;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--on-accent) 18%,transparent)}
.hw-flag.hw-warn{background:#FFE08A;color:#3A2A00}
.hw-flag.hw-alert{background:#FFFFFF;color:#B3261E}
.wx-line{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.wx-line b{font-weight:800;font-size:1.375rem;font-variant-numeric:tabular-nums}
.wx-line span{color:var(--ink-2);font-size:.875rem}
.hero-zones{display:flex;flex-wrap:wrap;gap:6px 24px;margin-top:12px;padding-top:10px;border-top:1px solid color-mix(in srgb,var(--on-accent) 25%,transparent)}
.hero-zones div{display:flex;flex-direction:column}
.hero-zones span{font-family:var(--font-mono);font-size:.6875rem;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.hero-zones b{font-variant-numeric:tabular-nums;font-size:1rem}

.seg.seg4 button{padding:7px 3px;font-size:.78rem}
/* alarms */
.al-next{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px;border-radius:var(--r);background:var(--accent-soft);margin-top:2px}
.al-next-time{font-stretch:118%;font-weight:800;font-size:2.25rem;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--accent-ink)}
.al-next .muted{font-size:.875rem;margin-top:2px}
.al-note{margin:10px 2px 0;font-size:.78rem;color:var(--ink-2)}
.alrow{display:flex;align-items:center;gap:12px;padding-block:12px;border-top:1px solid var(--line)}
.alrow:first-child{border-top:0}
.al-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left}
.al-time{font-stretch:112%;font-weight:750;font-size:2rem;line-height:1.05;font-variant-numeric:tabular-nums}
.al-time small{font-size:.45em;font-weight:700;margin-left:.3em;letter-spacing:.03em}
.al-meta{display:flex;flex-direction:column;min-width:0}
.al-meta b{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.al-meta span{font-size:.8rem;color:var(--ink-2);display:flex;align-items:center;gap:4px;flex-wrap:wrap;overflow-wrap:anywhere}
.al-meta .ic{width:13px;height:13px}
.al-meta .al-snz{color:var(--accent-ink);font-weight:650}
.alrow.off .al-time,.alrow.off .al-meta b{color:var(--ink-2)}
.al-time-in{font-size:2rem;font-weight:750;font-stretch:112%;text-align:center;padding:12px;font-variant-numeric:tabular-nums;margin-bottom:8px}
.al-hint{text-align:center;font-size:.845rem;color:var(--accent-ink);font-weight:650;margin:0 0 14px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:8px}
.days button{width:100%;max-width:44px;aspect-ratio:1/1;justify-self:center;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.845rem;text-align:center;color:var(--ink)}
.days button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.snd-list{display:grid;gap:6px;margin-bottom:8px}
.snd{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);text-align:left;cursor:pointer;color:var(--ink)}
.snd[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.snd>.ic{color:var(--accent-ink)}
.snd-t{flex:1;min-width:0;display:flex;flex-direction:column}
.snd-t b{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.snd-t small{font-size:.75rem;color:var(--ink-2)}
.snd-ck{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--on-accent)}
.snd[aria-pressed="true"] .snd-ck{background:var(--accent)}
.snd-ck .ic{width:14px;height:14px;stroke-width:3}
.snd.add{border-style:dashed;border-color:var(--accent)}
.snd.busy{opacity:.6;pointer-events:none}
.wrow{flex-wrap:wrap}
.srow .btn .ic{color:inherit}
.wrow .lbl{min-width:9rem}
.wrow-btns{display:flex;gap:6px;flex-wrap:wrap}
.chip-s{font-family:var(--font-mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.chip-s.ok{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
/* ringing */
.ring{position:fixed;inset:0;z-index:90;background:var(--accent);color:var(--on-accent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 24px) 24px calc(env(safe-area-inset-bottom,0px) + 32px);text-align:center}
.ring-ic{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--on-accent) 16%,transparent);animation:ringshake 1.2s ease-in-out infinite;margin-bottom:6px}
.ring-ic .ic{width:44px;height:44px}
@keyframes ringshake{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg) scale(1.05)}40%{transform:rotate(10deg) scale(1.05)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
.ring-time,.night-time{font-stretch:125%;font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;justify-content:center}
.ring-time{font-size:clamp(4rem,calc(14vw + 2rem),7rem)}
.ring-time .ap,.night-time .ap{font-size:.3em;font-weight:700;margin-left:.3em;font-stretch:100%;letter-spacing:.04em}
.ring-label{font-size:1.375rem;font-weight:750;overflow-wrap:anywhere;max-width:30ch}
.ring-sound{display:flex;align-items:center;gap:6px;opacity:.85;font-size:.9rem;max-width:100%}
.ring-sound .ic{width:16px;height:16px}
.ring-sound span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring-tap{margin-top:8px;padding:8px 16px;border-radius:999px;background:color-mix(in srgb,var(--on-accent) 18%,transparent);color:var(--on-accent);font-weight:700}
.ring-btns{display:grid;gap:12px;width:min(100%,360px);margin-top:28px}
.ring-btns button{padding:18px;border-radius:999px;font-size:1.125rem;font-weight:800;text-align:center}
.ring-stop{background:var(--on-accent);color:var(--accent)}
.ring-snooze{border:2px solid color-mix(in srgb,var(--on-accent) 55%,transparent);color:var(--on-accent)}
/* night mode: a deliberately dark bedside clock in every theme */
.night{position:fixed;inset:0;z-index:85;background:var(--night-bg);color:var(--night-fg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.night-inner{transition:transform 1.5s ease}
.night-time{font-weight:700;font-size:clamp(4.5rem,calc(17vw + 2rem),9rem)}
.night-date{margin-top:10px;font-size:1.0625rem;color:var(--night-dim);font-weight:600}
.night-next{margin-top:22px;display:inline-flex;align-items:center;gap:8px;font-weight:650;font-size:1rem}
.night-next .ic{width:18px;height:18px}
.night-foot{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--night-dim);font-size:.8rem;padding-inline:24px}
.night-foot button{color:var(--night-fg);border:1px solid var(--night-dim);border-radius:999px;padding:9px 18px;font-weight:650}

/* lifelog */
.day .n{position:relative}
.day .n.ll{background-size:cover!important;background-position:center!important;background-repeat:no-repeat!important;box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--accent)}
.day .n.ll.face{background:none;box-shadow:none}
.day .n.ll.face svg{width:115%;height:115%;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.25))}
.ll-num{position:absolute;right:-7px;bottom:-6px;min-width:17px;height:17px;padding:0 3px;border-radius:9px;background:var(--surface);color:var(--ink);font-size:.62rem;font-weight:800;display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.25);line-height:1}
.day.today .ll-num{background:var(--accent);color:var(--on-accent)}
.day.today .n.ll{background-color:transparent}
.ll-dot{position:absolute;top:1px;right:1px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.ll-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px}
.ll-ask{margin:0;font-weight:650}
.ll-faces{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ll-face{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface-2);font-size:.8rem;font-weight:650;color:var(--ink-2);text-align:center}
.ll-face svg{width:44px;height:44px;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.2))}
.ll-face[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.ll-faces.big .ll-face svg{width:56px;height:56px}
.ll-head{display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.ll-face-lg{width:52px;height:52px;flex:none;display:grid;place-items:center}
.ll-face-lg svg{width:52px;height:52px;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.2))}
.ll-face-lg.empty{border-radius:50%;background:var(--surface-2);color:var(--ink-2)}
.ll-head-t{display:flex;flex-direction:column;min-width:0}
.ll-head-t b{font-weight:750;font-size:1.0625rem}
.ll-head-t small{color:var(--ink-2);font-size:.8rem}
.ll-note{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink);display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.ll-strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.ll-strip::-webkit-scrollbar{display:none}
.ll-thumb{flex:none;width:76px;height:76px;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line)}
.ll-thumb img,.ll-ph-img img{width:100%;height:100%;object-fit:cover;display:block}
.ll-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ll-ph{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line)}
.ll-ph-img{position:absolute;inset:0;width:100%;height:100%}
.ll-x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.ll-x .ic{width:15px;height:15px}
.ll-badge{position:absolute;left:4px;bottom:4px;right:4px;font-size:.62rem;font-weight:750;padding:3px 6px;border-radius:999px;background:var(--accent);color:var(--on-accent);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ll-badge.btn-b{background:rgba(0,0,0,.55);color:#fff}
.ll-add{aspect-ratio:1/1;max-width:100%;border-radius:var(--r-sm);border:1.5px dashed var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--accent-ink);font-weight:700;font-size:.8rem;text-align:center;padding:6px;cursor:pointer}
.ll-add.busy{opacity:.6;pointer-events:none}
.ll-view{border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2);display:grid;place-items:center}
.ll-view img{max-width:100%;max-height:60vh;display:block}
.ll-fwrap{position:relative;display:inline-block;line-height:0;overflow:hidden;max-width:100%}
.ll-crop{position:absolute;border-radius:50%;box-shadow:0 0 0 2px #fff,0 0 0 9999px rgba(20,10,40,.5);pointer-events:none;transition:left .15s,top .15s,width .15s,height .15s}
.ll-adj{display:grid;gap:8px;margin-top:10px}
.ll-bub-prev{width:40px;height:40px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--accent)}
.ll-bub-prev img{width:100%;height:100%;object-fit:cover;display:block}
.ll-view-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.w-ll .ll-faces .ll-face svg{width:36px;height:36px}
/* weather */
.wx-ic{width:34px;height:34px;flex:none}
.wx-card{display:flex;align-items:center;gap:12px;width:100%;margin-bottom:14px;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);text-align:left;position:relative}
.wx-card.quiet{box-shadow:none}
.wx-now{display:flex;align-items:center;gap:6px}
.wx-now .wx-ic{width:40px;height:40px}
.wx-temp{font-stretch:118%;font-weight:800;font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.wx-mid{flex:1;min-width:0;display:flex;flex-direction:column}
.wx-mid b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wx-mid small{color:var(--ink-2);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wx-hl{display:flex;flex-direction:column;align-items:flex-end;font-variant-numeric:tabular-nums}
.wx-hl b{font-weight:750}
.wx-hl small{color:var(--ink-2)}
.wx-hl i{font-style:normal;font-size:.7rem;font-weight:700;color:#3D8BEF;white-space:nowrap}
.wx-warn{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--danger);color:#fff;font-weight:800;font-size:.75rem;display:grid;place-items:center}
.wx-msg{display:flex;align-items:center;gap:10px;width:100%;color:var(--ink-2);font-size:.875rem}
.wx-msg>span{flex:1;min-width:0}
.wx-msg .ic{color:var(--accent-ink)}
.wx-banner{padding:10px 12px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line);font-size:.875rem;margin-bottom:12px}
.wx-hero{display:flex;align-items:center;gap:14px;padding:6px 2px 12px}
.wx-hero .wx-ic{width:72px;height:72px}
.wx-big{font-stretch:125%;font-weight:800;font-size:3.5rem;line-height:1;font-variant-numeric:tabular-nums}
.wx-phrase{font-weight:700;font-size:1.0625rem;margin-top:2px}
.wx-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wx-stat{padding:10px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line);min-width:0}
.wx-stat span{display:block;font-family:var(--font-mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.wx-stat b{display:block;font-weight:700;font-size:.9rem;overflow-wrap:anywhere}
.wx-alert{display:flex;gap:10px;margin-top:10px;padding:10px 12px;border-radius:var(--r-sm);background:color-mix(in srgb,var(--danger) 12%,var(--surface));color:var(--ink)}
.wx-alert .ic{color:var(--danger)}
.wx-alert div{display:grid;gap:2px}
.wx-hours{display:flex;gap:2px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none}
.wx-hours::-webkit-scrollbar{display:none}
.wx-hour{flex:none;width:54px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 2px;font-variant-numeric:tabular-nums}
.wx-hour span{font-size:.72rem;color:var(--ink-2);white-space:nowrap}
.wx-hour .wx-ic{width:28px;height:28px}
.wx-hour b{font-weight:650}
.wx-hour small{font-size:.68rem;color:var(--ink-2);min-height:1em}
.wx-hour small.wet{color:#3D8BEF;font-weight:600}
.wx-days{padding:4px 16px}
.wx-day{display:grid;grid-template-columns:minmax(0,1fr) auto 30px 30px 5.6em;gap:12px;align-items:center;padding-block:11px;font-variant-numeric:tabular-nums}
.wx-day .wx-ic{width:28px;height:28px}
.wx-dn{font-weight:700;font-size:1rem}
.wx-rain{display:flex;align-items:center;gap:3px;font-size:.8rem;color:var(--ink-2);opacity:.75}
.wx-rain svg{width:13px;height:13px}
.wx-rain.wet{color:#3D8BEF;opacity:1;font-weight:600}
.wx-temps{text-align:right;white-space:nowrap;font-size:1rem}
.wx-temps b{font-weight:700}
.wx-temps span{color:var(--ink-2);margin-left:6px}
.wx-day.past{opacity:.5}
.wx-day.past .wx-dn{font-weight:600}
.wx-more{display:flex;justify-content:flex-end;padding:4px 0 10px}
.wx-more .link{display:inline-flex;align-items:center;gap:4px}.wx-more .ic{width:14px;height:14px}
.wx-foot{font-size:.75rem;color:var(--ink-2);margin:12px 2px 0}
.wx-res{display:grid;gap:6px;padding-bottom:12px}
.agenda-wx{display:flex;align-items:center;gap:8px;margin:-4px 0 10px;font-size:.845rem;color:var(--ink-2)}
.agenda-wx .wx-ic{width:22px;height:22px}

/* coming up (on the clock) */
.hero-up{position:relative;z-index:2;margin-top:12px;padding-top:10px;border-top:1px solid color-mix(in srgb,var(--on-accent) 25%,transparent)}
.hu-label{font-family:var(--font-mono);font-size:.6875rem;letter-spacing:.08em;text-transform:uppercase;opacity:.8;margin-bottom:2px}
.hu{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:7px 0;text-align:left;color:inherit}
.hu .ic{width:17px;height:17px;opacity:.85}
.hu-t{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hu-when{display:flex;align-items:center;gap:6px;font-size:.845rem;font-variant-numeric:tabular-nums;white-space:nowrap;opacity:.92}
.hu-late{font-family:var(--font-mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;background:var(--on-accent);color:var(--accent);padding:2px 6px;border-radius:999px}
.hu-empty{opacity:.85;font-size:.875rem;padding:4px 0 2px}

/* AI assistant */
.ai{margin-bottom:20px}
.ai-bar{display:flex;align-items:center;gap:8px;padding:5px 5px 5px 14px;border-radius:var(--r);background:var(--surface);border:1.5px solid var(--accent);box-shadow:var(--shadow)}
.ai-bar:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.ai-ic{display:grid;color:var(--accent-ink)}
.ai-in{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:1rem;color:var(--ink);padding:10px 0;outline:none}
.ai-in::placeholder{color:var(--ink-2)}
.ai-go{width:42px;height:42px;flex:none;border-radius:calc(var(--r) - 7px);background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.ai-ex{margin-top:10px}
.ai-ex .chip{white-space:normal;text-align:left;font-weight:600;color:var(--ink-2)}
.ai-tip{margin:8px 2px 0;font-size:.75rem;color:var(--ink-2)}
.ai-out{margin-top:10px;padding:14px;border-radius:var(--r);background:var(--accent-soft);display:grid;gap:10px}
.ai-out.err{background:var(--surface-2)}
.ai-out.busy{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ai-out p{margin:0}
.ai-reply{font-weight:600}
.ai-lines{display:grid;gap:6px}
.ai-line{display:flex;gap:10px;align-items:center;width:100%;padding:10px 12px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line);text-align:left}
.ai-line .ic{color:var(--accent-ink)}
.ai-line span{display:flex;flex-direction:column;min-width:0}
.ai-line b{font-weight:650;overflow-wrap:anywhere}
.ai-line small{color:var(--ink-2);font-size:.78rem}
.ai-think{display:flex;align-items:center;gap:10px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.dots3{display:inline-flex;gap:4px;flex:none}
.dots3 i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:blink 1.2s infinite ease-in-out}
.dots3 i:nth-child(2){animation-delay:.2s}
.dots3 i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* menu */
.sec-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:20px 0 10px;font-family:var(--font-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);scroll-margin-top:128px}
.sec-title.first{margin-top:4px}
.sec-title.danger{color:var(--danger)}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:16px;min-height:9rem;min-width:0;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);text-align:left;transition:transform .12s ease}
.tile:active{transform:scale(.98)}
.tile.wide{grid-column:span 2;flex-direction:row;align-items:center;justify-content:flex-start;min-height:0}
.tile-ic{width:48px;height:48px;flex:none;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink)}
.tile-ic .ic{width:26px;height:26px}
.cal-page{width:48px;height:52px;flex:none;border-radius:12px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;background:var(--surface)}
.cal-page small{background:var(--accent);color:var(--on-accent);font-family:var(--font-mono);font-size:.625rem;letter-spacing:.1em;text-align:center;padding:3px 0 2px;text-transform:uppercase}
.cal-page b{flex:1;display:grid;place-items:center;font-stretch:125%;font-weight:800;font-size:1.25rem;color:var(--ink);font-variant-numeric:tabular-nums}
.tile-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.tile-txt>b{font-stretch:118%;font-weight:800;font-size:1.1875rem;line-height:1.15}
.tile-txt>span{font-size:.8125rem;color:var(--ink-2);overflow-wrap:anywhere}
.tile-txt>span b{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.tile .chev{display:none;color:var(--ink-2)}
.menu.list{grid-template-columns:1fr;gap:8px}
.menu.list .tile{flex-direction:row;align-items:center;min-height:0;padding:12px 14px;gap:14px}
.menu.list .tile.wide{grid-column:auto}
.menu.list .tile-txt{flex:1}
.menu.list .chev{display:block}
.menu-empty{padding:22px;border:1.5px dashed var(--line);border-radius:var(--r);text-align:center;color:var(--ink-2)}

/* widgets */
.edit-hint{margin:0 0 12px;color:var(--ink-2);font-size:.845rem}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.w{position:relative;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.w.full{grid-column:span 2}
.grid.editing .w{border-style:dashed}
.grid.editing .w-body{pointer-events:none;opacity:.5}
.w-label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-family:var(--font-mono);font-size:.6875rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.w-label>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-edit{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;position:relative;z-index:2}
.mini{height:30px;min-width:30px;padding:0 9px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);font-size:.78rem;font-weight:650;display:inline-flex;align-items:center;justify-content:center}
.mini .ic{width:16px;height:16px}
.mini.danger{color:var(--danger)}
.mini.danger.armed{background:var(--danger);color:var(--surface)}
.add-widget{width:100%;margin-top:12px;padding:16px;border-radius:var(--r);border:1.5px dashed var(--accent);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;color:var(--accent-ink)}
.cap{display:grid;gap:10px}
.cap-row{display:flex;gap:8px}
.cap-row .in{flex:1}
.ag{display:grid;grid-template-columns:minmax(62px,auto) 4px minmax(0,1fr);gap:10px;align-items:center;width:100%;padding-block:9px;border-top:1px solid var(--line);text-align:left}
.ag:first-child{border-top:0;padding-top:2px}
.ag-time{font-family:var(--font-mono);font-size:.75rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.ag-bar{width:4px;height:22px;border-radius:2px;background:var(--accent)}
.ag-bar.rem{background:none;border:1.5px solid var(--ink-2)}
.ag-t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-empty{margin:2px 0 10px;color:var(--ink-2)}
.wr{display:flex;gap:10px;align-items:flex-start;padding-block:8px;border-top:1px solid var(--line)}
.wr:first-child{border-top:0;padding-top:2px}
.wr .chk{width:22px;height:22px}
.wr-t{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column}
.wr-t b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wr-t span{font-size:.78rem;color:var(--ink-2)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.count{display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums}
.count b{font-stretch:125%;font-weight:800;font-size:2.5rem;line-height:1}
.count span{color:var(--ink-2);font-weight:650}
.bar{height:6px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin:10px 0 12px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.met i{background:var(--ok)}
.cd b{display:block;font-stretch:125%;font-weight:800;font-size:2.5rem;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent-ink)}
.cd span{display:block;font-weight:650;margin-top:4px}
.cd small{display:block;color:var(--ink-2);font-size:.78rem;margin-top:2px}
.ci{display:flex;gap:10px;align-items:center;width:100%;padding-block:6px;text-align:left}
.ci .chk{width:22px;height:22px;margin:0}
.ci.on span:last-child{text-decoration:line-through;color:var(--ink-2)}
.lnk{display:flex;gap:10px;align-items:center;padding-block:9px;border-top:1px solid var(--line);text-decoration:none;font-weight:600}
.lnk:first-child{border-top:0;padding-top:2px}
.lnk .ic{width:18px;height:18px;color:var(--accent-ink)}
.lnk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pn button{min-width:0;text-align:left;padding:10px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line)}
.pn b{display:block;font-size:.875rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:.78rem;color:var(--ink-2)}

/* lists */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:2px 14px}
.rrow{display:flex;gap:12px;align-items:flex-start;padding-block:12px;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rtext{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left}
.rt{font-weight:560;overflow-wrap:anywhere}
.rmeta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:.78rem;color:var(--ink-2)}
.rmeta .ic{width:14px;height:14px}
.rmeta i{font-style:normal;display:inline-flex;align-items:center;gap:3px}
.overdue .due{color:var(--danger);font-weight:650}
.rrow.done .rt{text-decoration:line-through;color:var(--ink-2)}
.quick{display:flex;gap:8px;margin-bottom:4px}
.quick .in{flex:1}
.empty{padding:32px 12px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:1rem;margin-bottom:4px}

/* calendar */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 6px 6px}
.cal-nav{display:flex;align-items:center;gap:8px;padding:2px 4px 8px}
.cal-nav b{flex:1;text-align:center;font-stretch:118%;font-weight:800;font-size:1.125rem}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.dow{text-align:center;font-family:var(--font-mono);font-size:.65rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding-block:4px 6px}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;padding-block:4px 6px;border-radius:var(--r-sm);font-weight:650;font-variant-numeric:tabular-nums;min-width:0}
.day .n{width:2rem;height:2rem;display:grid;place-items:center;border-radius:50%}
.day.out{color:var(--ink-2);opacity:.5}
.day.today .n{background:var(--accent);color:var(--on-accent)}
.day.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.dots{display:flex;gap:3px;height:6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.dot.ring{background:none;border:1.5px solid var(--ink-2)}
.ev{display:grid;grid-template-columns:4px minmax(64px,auto) minmax(0,1fr);gap:12px;align-items:start;width:100%;padding-block:12px;border-top:1px solid var(--line);text-align:left}
.ev:first-child{border-top:0}
.ev-bar{width:4px;align-self:stretch;min-height:22px;border-radius:2px}
.ev-time{font-family:var(--font-mono);font-size:.78rem;font-variant-numeric:tabular-nums;line-height:1.5}
.ev-main{display:flex;flex-direction:column;min-width:0}
.ev-main b{font-weight:650;overflow-wrap:anywhere}
.ev-main span{font-size:.8125rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agenda-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* notes */
.search{position:relative;margin-bottom:6px}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink-2)}
.search .in{padding-left:38px}
.notes-grid{columns:2;column-gap:10px}
.notes-grid.list{columns:1}
.note{display:block;width:100%;break-inside:avoid;margin-bottom:10px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);text-align:left}
.note b{display:flex;gap:6px;align-items:flex-start;justify-content:space-between;font-size:.9375rem;line-height:1.3;overflow-wrap:anywhere}
.note b .ic{width:15px;height:15px;color:var(--accent-ink);margin-top:2px}
.note p{margin:6px 0 8px;font-size:.845rem;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:var(--clamp,5);-webkit-box-orient:vertical;overflow:hidden}
.note small{font-family:var(--font-mono);font-size:.65rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}

/* clock area */
.clock-face{padding-block:18px 6px}
.clock-face .big-time{font-size:clamp(3.6rem,calc(15vw + 1.6rem),7.25rem)}
.clock-face .big-time .sec{color:var(--accent-ink);opacity:1}
.clock-face .hero-date{font-size:1.0625rem}
.facts{margin-top:6px;font-family:var(--font-mono);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.zrow{display:flex;align-items:center;gap:12px;padding-block:12px;border-top:1px solid var(--line)}
.zrow:first-child{border-top:0}
.zmeta{flex:1;min-width:0;display:flex;flex-direction:column}
.zmeta b{font-weight:650}
.zmeta span{font-size:.78rem;color:var(--ink-2)}
.ztime{font-stretch:112%;font-weight:750;font-size:1.5rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.sw-num{text-align:center;font-stretch:112%;font-weight:750;font-size:clamp(3.1rem,calc(12vw + 1.4rem),5.25rem);letter-spacing:-.02em;font-variant-numeric:tabular-nums;padding-block:36px 30px;white-space:nowrap}
.pair{display:flex;justify-content:space-between;gap:16px;max-width:340px;margin:0 auto}
.round{width:86px;height:86px;border-radius:50%;font-weight:700;background:var(--surface-2);border:1px solid var(--line);text-align:center}
.round.go{background:var(--accent);color:var(--on-accent);border-color:transparent}
.round.stop{background:var(--danger);color:var(--surface);border-color:transparent}
.laps{list-style:none;margin:22px 0 0;padding:0 14px;font-variant-numeric:tabular-nums}
.laps li{display:grid;grid-template-columns:1fr auto auto;gap:18px;padding-block:10px;border-top:1px solid var(--line)}
.laps li:first-child{border-top:0}
.laps .tot{color:var(--ink-2)}
.laps .fast{color:var(--ok);font-weight:650}
.laps .slow{color:var(--danger);font-weight:650}
.ring-wrap{position:relative;width:min(76vw,300px);max-width:100%;aspect-ratio:1/1;margin:14px auto 18px}
.ring-wrap svg{position:absolute;inset:0;width:100%;height:100%}
.tick{stroke:var(--line);stroke-width:2}
.tick.major{stroke:var(--ink-2);stroke-width:2.5}
.track{stroke:var(--surface-2);fill:none}
.prog{stroke:var(--accent);fill:none;stroke-linecap:round}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-center b{font-stretch:112%;font-weight:800;font-size:clamp(2.5rem,calc(9vw + 1rem),3.6rem);font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.ring-center span{margin-top:6px;font-family:var(--font-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.tm-set{display:grid;gap:12px;justify-items:center}
.tm-custom{display:flex;align-items:center;gap:8px}
.tm-custom .in{width:76px;text-align:center;font-variant-numeric:tabular-nums}

/* settings */
.saved{font-family:var(--font-mono);font-size:.65rem;letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);white-space:nowrap}
.saved[data-state="saving"]{background:var(--surface-2);color:var(--ink-2)}
.jump{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.jump::-webkit-scrollbar{display:none}
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:2px 14px}
.srow{display:flex;align-items:center;gap:12px;padding-block:12px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow.stack{flex-direction:column;align-items:stretch;gap:8px}
.srow .lbl{flex:1;min-width:0;font-weight:600}
.srow small{display:block;font-weight:400;color:var(--ink-2);font-size:.78rem}
.srow input.in,.srow select.in{flex:0 1 180px;width:180px;max-width:52%}
.srow .ic{color:var(--accent-ink)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.acc{width:34px;height:34px;border-radius:50%;background:var(--sw);border:1px solid var(--line)}
.acc[aria-pressed="true"],.cdot[aria-pressed="true"]{outline:2.5px solid var(--ink);outline-offset:2px}
.cdot{width:30px;height:30px;border-radius:50%;background:var(--sw);border:1px solid var(--line)}
.cdot.none{background:linear-gradient(135deg,transparent 46%,var(--ink-2) 47%,var(--ink-2) 53%,transparent 54%),var(--surface-2)}
.status{display:flex;gap:10px;align-items:flex-start;font-size:.875rem}
.status i{width:9px;height:9px;flex:none;border-radius:50%;margin-top:6px;background:var(--ink-2)}
.status.on i{background:var(--ok)}
.vol{font-family:var(--font-mono);font-size:.75rem;color:var(--ink-2);min-width:3em;text-align:right}

/* sheet, alerts, toast */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;width:100%;max-width:560px;max-height:90%;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:6px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:rise .2s ease-out}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
@keyframes rise{from{transform:translateY(28px);opacity:.5}}
.sh-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}

.fld{display:grid;gap:6px;margin-bottom:12px;min-width:0}

.fld-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hint{margin:-4px 0 12px;font-size:.78rem;color:var(--ink-2)}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px;margin-bottom:8px;font-weight:600}
.sh-actions{display:flex;gap:10px;align-items:center;margin-top:16px}
.pick{display:flex;align-items:center;gap:12px;width:100%;padding-block:12px;border-top:1px solid var(--line);text-align:left}
.pick:first-child{border-top:0}
.pick div{flex:1;min-width:0}
.pick b{display:block}
.pick span{font-size:.8125rem;color:var(--ink-2)}
.pick .ic{color:var(--accent-ink)}
.city-list{max-height:52vh;overflow-y:auto}
.alerts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:60;display:grid;gap:8px;padding-inline:16px;max-width:592px;margin:0 auto;pointer-events:none}
.alert{pointer-events:auto;background:var(--accent);color:var(--on-accent);border-radius:18px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:rise .2s ease-out}
.alert b{display:block;font-size:1rem;overflow-wrap:anywhere}
.alert small{display:block;opacity:.85;margin-top:2px}
.alert .row-btns{margin-top:10px}
.alert .btn{background:transparent;color:var(--on-accent);border-color:color-mix(in srgb,var(--on-accent) 40%,transparent)}
.alert .btn.solid{background:var(--on-accent);color:var(--accent);border-color:transparent}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);transform:translateX(-50%);z-index:70;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.875rem;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (min-width:600px){.hd h1{font-size:1.875rem}}
/* themes */
#thBg{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;pointer-events:none;transform:translateZ(0)}
:root.th-on body{background-image:var(--th-pattern,none);background-attachment:fixed}

:root.th-wobble .tile:nth-child(2n){animation-delay:-2s}:root.th-wobble .tile:nth-child(3n){animation-delay:-4s}
@keyframes thWob{0%,100%{rotate:0deg;scale:1 1}33%{rotate:.45deg;scale:1.008 .994}66%{rotate:-.45deg;scale:.994 1.008}}
:root.th-serif h1,:root.th-serif .big-time,:root.th-serif .tile-txt b{font-family:Georgia,"Times New Roman",serif;font-stretch:100%}
.hero.th-hero-img{background-size:cover;background-position:center;text-shadow:0 1px 3px rgba(0,0,0,.35)}

.th-buddy{display:block;pointer-events:none;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25));transform-origin:50% 100%}
.th-buddy.at-hold{margin:-.35em auto 6px;position:relative;z-index:1}
.th-buddy.at-hold.sz-s{width:28%;max-width:110px}.th-buddy.at-hold.sz-m{width:40%;max-width:170px}.th-buddy.at-hold.sz-l{width:56%;max-width:240px}
.th-buddy.at-corner{position:absolute;right:8px;bottom:0;z-index:0;opacity:.95}

.th-buddy.mv-squish{animation:thSquish 2.4s ease-in-out infinite}

@keyframes thSquish{0%,100%{transform:scale(1,1)}50%{transform:scale(1.06,.9)}}
@keyframes thLift{0%,100%{transform:translateY(0)}50%{transform:translateY(.06em)}}
@keyframes thBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8%)}}
.tile-ic.th-tile{background:none!important;width:auto;height:auto}

.note.has-runner{position:relative;overflow:hidden;padding-bottom:40px}

@keyframes thRun{from{transform:translateX(0)}to{transform:translateX(100%)}}   /* moves on the graphics chip, no redraw */

.th-face{width:115%;height:115%;object-fit:contain;display:block}
.ll-face .th-face{width:44px;height:44px}.ll-faces.big .ll-face .th-face{width:56px;height:56px}.ll-face-lg .th-face{width:52px;height:52px}.w-ll .ll-faces .ll-face .th-face{width:36px;height:36px}

#thMascot{pointer-events:auto!important;cursor:pointer}

#buddyBubble{position:fixed;right:14px;bottom:calc(172px + env(safe-area-inset-bottom,0px));z-index:65;width:min(330px,calc(100vw - 28px));padding:14px 14px 12px;border-radius:20px;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:0 10px 30px rgba(30,15,70,.22);animation:bbPop .22s cubic-bezier(.2,.9,.3,1.25)}

#buddyBubble .bb-form{display:flex;gap:8px;margin-top:8px}
#buddyBubble .bb-form .in{flex:1;min-width:0}
#buddyBubble .ai-go{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--accent);color:var(--on-accent)}
.bb-typing{display:flex;gap:5px;padding:6px 0}
.bb-typing i{width:8px;height:8px;border-radius:50%;background:var(--accent);opacity:.4;animation:bbDot 1s infinite}
.bb-typing i:nth-child(2){animation-delay:.15s}.bb-typing i:nth-child(3){animation-delay:.3s}
@keyframes bbDot{0%,100%{opacity:.3;transform:none}50%{opacity:1;transform:translateY(-3px)}}

.hd.hd-float{position:sticky;top:0;height:0;padding:0;margin:0;background:none;justify-content:flex-end;gap:8px;z-index:7;overflow:visible;pointer-events:none}
.hd.hd-float .ib{pointer-events:auto;transform:translate(-12px,26px);background:color-mix(in srgb,var(--surface) 84%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid color-mix(in srgb,var(--line) 75%,transparent);box-shadow:0 3px 12px rgba(30,15,70,.14)}
.hd.hd-float + .hero{margin-top:12px}
.hd.hd-float + .hero .hero-top{flex-direction:column;align-items:flex-start;padding-right:104px;min-height:48px}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.acc-pick{position:relative;background:var(--sw)!important;overflow:hidden;cursor:pointer}
.acc-pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}

/* low-power mode */
:root.idle *,:root.idle *::before,:root.idle *::after{animation-play-state:paused!important;transition:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
:root.idle .ring-ic{animation-play-state:running!important}

/* phone app: skip see-through blur (the costliest effect while scrolling) and use solid-looking buttons instead */
:root.is-phone *{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
:root.is-phone .dock button:not([aria-current="page"]):not([aria-pressed="true"]),:root.is-phone .hd .ib{background:color-mix(in srgb,var(--surface) 95%,transparent)}

/* theme note cards */
.note.has-card{position:relative;isolation:isolate;overflow:hidden}
.note.has-card::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--ncard) center/cover no-repeat;opacity:calc(1 - var(--nfade,.5));pointer-events:none}
.note.has-card.card-corner{min-height:84px}
.note.has-card.card-corner::before{background:var(--ncard) right 8px bottom 8px/auto 60px no-repeat;opacity:calc(1 - var(--nfade,.5) * .6)}
.note.has-card.card-corner p{padding-right:52px}
.note.card-clear{background:color-mix(in srgb,var(--surface) 55%,transparent)!important;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.note.card-line{background:transparent!important;border:1.5px solid color-mix(in srgb,var(--ink) 30%,transparent)}

/* open note background picture */
.sheet.has-nbg{background-image:linear-gradient(var(--nbgveil),var(--nbgveil)),var(--nbg);background-size:cover;background-position:center}
.sheet.has-nbg .in{background:color-mix(in srgb,var(--surface) 82%,transparent)}

.set-search .in{padding-right:44px}
.set-search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;display:none}
.ss-x{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);background:color-mix(in srgb,var(--ink) 8%,transparent)}
.ss-x .ic{position:static;transform:none;width:16px;height:16px}
.ss-x[hidden]{display:none}

  if (!e) { e = {next:undefined, running:null}; wq.set(ref.path, e); }
  e.next = data;
  if (!e.running) {
    pendingWrites++; updateSaved();
    e.running = (async () => {
      while (e.next !== undefined) {
        const d = e.next; e.next = undefined;
        try { if (d === null) await ref.delete(); else await ref.set(d); }
        catch (err) { onWriteErr(err); }
      }
      e.running = null; wq.delete(ref.path); pendingWrites--; updateSaved();
    })();
  }
  return e.running;
}
function onWriteErr(err){
  const code = err && err.code;
  if (code === 'quota_exceeded') toast('Your storage is full. Delete a few notes or events to save more.');

    mode = 'local'; if (!syncWarned) { syncWarned = true; toast('Syncing stopped. Changes are kept in this browser.'); } scheduleRender();
  } else if (!syncWarned) { syncWarned = true; toast('A change did not sync. It is kept in this browser.'); }
}

}

async function initCloud(){
  if (!window.claude || typeof window.claude.use !== 'function') { aiState = 'off'; mcpState = 'off'; return; }
  window.claude.use('sample').then(fn => { aiFn = fn || null; aiState = fn ? 'ready' : 'off'; scheduleRender(); }).catch(() => { aiState = 'off'; scheduleRender(); });
  window.claude.use('assets').then(ns => { assetsNs = ns || null; }).catch(() => {});
  window.claude.use('mcp').then(ns => { mcpNs = ns || null; mcpState = ns ? 'ready' : 'off'; syncWeather.last = null; syncWeather(); scheduleRender(); }).catch(() => { mcpState = 'off'; scheduleRender(); });
  window.claude.use('downloads').then(ns => { dl = ns || null; if (dl && ui.screen === 'settings') scheduleRender(); }).catch(() => {});
  let dbns = null, user = null;
  try { [dbns, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch (e) { return; }
  if (!dbns || !user) return;
  let id = null;
  try { id = await user.id(); } catch (e) {}
  if (!id) return;
  db = dbns;
  const base = 'data/users/' + id;
  try {
    refs.settings = db.doc(base + '/settings');
    COLLS.forEach(c => { refs[c] = db.doc(base + '/' + c).collection('items'); });
  } catch (e) { return; }
  let snap;
  try { snap = await refs.settings.get(); } catch (e) { return; }
  if (!snap.exists && hadLocal) {
    // First time on this account: carry over what this browser already has.
    try {
      await refs.settings.set(clone(S.settings));
      for (const c of COLLS) for (const k of Object.keys(S[c])) await refs[c].doc(k).set(clone(S[c][k]));
    } catch (e) { return; }
  }
  mode = 'cloud';
  let firstSettings = true;
  refs.settings.onSnapshot(s => {
    if (!s.exists || settingsDirty) return;
    S.settings = normSettings(clone(s.data()));
    lsSave(); applySettings();
    if (firstSettings) { firstSettings = false; if (!userNavigated && !location.hash.slice(1)) ui.screen = startScreen(); }
    scheduleRender();
  }, onDbErr);
  COLLS.forEach(c => refs[c].onSnapshot(qs => {
    const o = {}; qs.docs.forEach(d => { o[d.id] = clone(d.data()); });
    S[c] = o; lsSave(); scheduleRender();
  }, onDbErr));
  scheduleRender();
}

function remDue(r){

  return 'upcoming';
}

function nextDate(r){

    if (r.repeat === 'weekdays') { let x = addDays(s, 1); while ([0, 6].includes(parseYmd(x).getDay())) x = addDays(x, 1); return x; }

      return ymd(new Date(y, mo, Math.min(dom, new Date(y, mo + 1, 0).getDate())));

}

function wxNum(v){ const n = parseFloat(String(v == null ? '' : v).replace(/[^0-9.\-]/g, '')); return isNaN(n) ? null : n; }
function wxAlertText(a){ return a ? String(a.title || a.headline || a.description || a.name || a.event || a.alertType || a.category || '').trim() : ''; }
// Rain outlook for the rest of today: the higher of the next 12 hours and today's forecast.
function wxRain(){
  const hrs = (weather.hourly && weather.hourly.hourlyForecast) || [], t = wxToday();
  const hp = hrs.map(h => wxNum(h.precip) || 0), hmax = hp.length ? Math.max.apply(null, hp) : 0;
  const dp = t ? Math.max(t.day ? t.day.rainProbabilityValue || 0 : 0, t.night ? t.night.rainProbabilityValue || 0 : 0) : 0;
  const pct = Math.round(Math.max(hmax, dp));
  const first = hrs.find(h => (wxNum(h.precip) || 0) >= 40);
  return {pct, when:first ? first.dateTime : ''};
}
// Special conditions worth flagging: official alerts first, then strong wind, storms, heat, UV, heavy rain, snow.
function wxFlags(){
  const out = [], seen = new Set(), metric = S.settings.wxUnit === 'metric', cur = weather.current, t = wxToday();
  const add = (text, level) => { const k = text.toLowerCase(); if (!text || seen.has(k)) return; seen.add(k); out.push({text, level}); };
  const alerts = [].concat((cur && cur.alerts) || [], (weather.daily && weather.daily.alerts) || [], (t && t.alerts) || [], (t && t.day && t.day.alerts) || []);
  alerts.forEach(a => add(wxAlertText(a) || 'Weather alert in effect', 'alert'));
  const hrs = (weather.hourly && weather.hourly.hourlyForecast) || [];
  const gustH = Math.max.apply(null, [0].concat(hrs.map(h => (h.extended && wxNum(h.extended.gustsValue != null ? h.extended.gustsValue : h.extended.gusts)) || 0)));
  const gustD = t && t.day && t.day.extended ? wxNum(t.day.extended.gusts) || 0 : 0;
  const gustC = cur && cur.currentConditions && cur.currentConditions.extended ? wxNum(cur.currentConditions.extended.gusts) || 0 : 0;
  const gust = Math.max(gustH, gustD, gustC), windU = metric ? 'km/h' : 'mph';
  if (gust >= (metric ? 64 : 40)) add('High wind · gusts to ' + Math.round(gust) + ' ' + windU, 'warn');
  else if (gust >= (metric ? 48 : 30)) add('Windy · gusts to ' + Math.round(gust) + ' ' + windU, 'info');
  if (t && t.day && t.day.extended) {
    const ts = Math.max(wxNum(t.day.extended.thunderstormProbability) || 0, t.night && t.night.extended ? wxNum(t.night.extended.thunderstormProbability) || 0 : 0);
    if (ts >= 40) add('Thunderstorms likely · ' + Math.round(ts) + '%', 'warn');
    const rf = t.day.realFeelValue, hrNow = new Date().getHours();
    if (typeof rf === 'number' && hrNow < 17) {
      if (rf >= (metric ? 42 : 108)) add('Extreme heat this afternoon · up to ' + deg(rf), 'warn');
      else if (rf >= (metric ? 39 : 103)) add('Very hot this afternoon · up to ' + deg(rf), 'info');
    }
    const lo = t.night && t.night.temperature;
    if (typeof lo === 'number' && lo <= (metric ? 0 : 32)) add('Freezing tonight · low ' + deg(lo), 'warn');
    const uv = t.day.extended.uv && t.day.extended.uv.value;
    if (typeof uv === 'number' && uv >= 8) add('Very high UV · ' + Math.round(uv), 'info');
    const rain = (t.day.extended.rainValue || 0) + (t.night && t.night.extended ? t.night.extended.rainValue || 0 : 0);
    if (rain >= (metric ? 25 : 1)) add('Heavy rain · ' + (Math.round(rain * 10) / 10) + (metric ? ' mm' : ' in'), 'warn');
    const snow = (t.day.extended.snowValue || 0) + (t.night && t.night.extended ? t.night.extended.snowValue || 0 : 0);
    if (snow > 0) add('Snow · ' + (Math.round(snow * 10) / 10) + (metric ? ' cm' : ' in'), 'warn');
  }
  return out;
}

// Next reminders and events, soonest first. Overdue reminders come first because their time has passed.
function upcomingItems(n){
  const now = Date.now(), t = todayStr(), items = [];
  Object.entries(S.events).forEach(([id, e]) => {
    if (!e.date || e.date < t) return;
    const day = parseYmd(e.date);
    let startTs = day.getTime(), endTs = day.getTime() + DAY - 1;
    if (e.start) {
      const [h, m] = e.start.split(':').map(Number); const st = new Date(day); st.setHours(h, m, 0, 0);
      startTs = st.getTime(); endTs = startTs + 60 * 6e4;
      if (e.end) { const [h2, m2] = e.end.split(':').map(Number); const en = new Date(day); en.setHours(h2, m2, 0, 0); endTs = en.getTime(); }
    }
    if (endTs < now) return;
    items.push({kind:'event', id, title:e.title, date:e.date, time:e.start, ts:startTs});
  });
  openRems().forEach(([id, r]) => { if (r.date) items.push({kind:'rem', id, title:r.text, date:r.date, time:r.time, ts:remDue(r), late:remStatus(r) === 'overdue'}); });
  return items.sort((a, b) => a.ts - b.ts).slice(0, n);
}
